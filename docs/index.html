<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Salish Tides</title>
  <meta name="description" content="Real-time offline current map for the Salish Sea.">
  <link rel="icon" href="logo.png">

  <!-- Social preview. og:url / og:image are absolute; update the domain here
       if the site is ever served somewhere other than salishtides.app. -->
  <meta property="og:title" content="Salish Tides">
  <meta property="og:description" content="Real-time offline current map for the Salish Sea.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://salishtides.app/">
  <meta property="og:image" content="https://salishtides.app/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Salish Tides">
  <meta name="twitter:description" content="Real-time offline current map for the Salish Sea.">
  <meta name="twitter:image" content="https://salishtides.app/og-image.png">

  <link rel="stylesheet" href="/site.css">
  <style>
    /* Tokens, reset, and base body typography come from /site.css. */
    html, body { height: 100%; }

    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 2rem 1.25rem;
      gap: 2rem;
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 1.75rem;
    }

    /* Logo — hand-drawn mark, black strokes on transparent. */
    .logo {
      width: 300px;
      max-width: 78vw;
      height: auto;
      display: block;
    }

    /* Hand-drawn App Store button (download CTA). */
    .appstore {
      display: block;
      line-height: 0;
      transition: opacity 0.15s ease;
    }
    .appstore:hover,
    .appstore:focus-visible { opacity: 0.7; }
    .appstore img {
      width: 105px;
      max-width: 31vw;
      height: auto;
    }

    /* Strokes are near-black ink; invert to light on the dark background. */
    @media (prefers-color-scheme: dark) {
      .logo,
      .appstore img { filter: invert(1); }
    }

    .tagline {
      margin: 0;
      max-width: 34ch;
      font-size: 1rem;
      line-height: 1.6;
      letter-spacing: 0.01em;
      color: var(--fg);
    }

    footer {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 2rem;
      font-size: 0.8125rem;
      letter-spacing: 0.02em;
    }

    .copyright {
      margin: 0;
      font-size: 0.6875rem;
      letter-spacing: 0.02em;
      color: var(--muted);
    }

    nav a {
      color: var(--muted);
      text-decoration: none;
      transition: color 0.15s ease;
    }
    nav a:hover,
    nav a:focus-visible { color: var(--fg); }

    /* Fixed to the bottom on tall viewports; flows naturally on short ones. */
    @media (min-height: 560px) {
      body { justify-content: space-between; }
      body::before { content: ""; }   /* top spacer to keep main centered */
      main { flex: 1; justify-content: center; }
    }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="logo.png" alt="Salish Tides">
    <p class="tagline">predictive offline current maps<br>for the Salish Sea and beyond</p>
    <a class="appstore" href="https://apps.apple.com/us/app/salish-tides/id6791828601" aria-label="Download on the App Store">
      <img src="app-store-btn.png" alt="Download on the App Store">
    </a>
  </main>

  <footer>
    <nav>
      <a href="https://apps.apple.com/us/app/salish-tides/id6791828601">download</a>
      <a href="/about">about</a>
      <a href="/changelog">changelog</a>
      <a href="/privacy">privacy</a>
    </nav>
    <p class="copyright">&copy; Bryan Guenther <span id="year">2026</span></p>
  </footer>

  <script>document.getElementById("year").textContent = new Date().getFullYear();</script>
</body>
</html>
